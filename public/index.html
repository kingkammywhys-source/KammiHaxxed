<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KammiHaxed // Pink Slutty Node</title>
    <style>
        body {
            background-color: #050005;
            color: #ff00ff; /* Neon Pink */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff69b4;
            animation: glitch 1s infinite alternate;
        }
        .container {
            width: 100%;
            max-width: 600px;
            border: 2px solid #ff00ff;
            padding: 20px;
            box-shadow: 0 0 30px #ff00ff, inset 0 0 20px #ff69b4;
            background: linear-gradient(135deg, #1a001a 0%, #000 100%);
            position: relative;
        }
        .card-display {
            border: 1px dashed #ff69b4;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 1.2em;
            word-break: break-all;
            text-shadow: 0 0 5px #ff00ff;
            background: rgba(255, 0, 255, 0.1);
        }
        button {
            background-color: #ff00ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 10px #ff00ff;
        }
        button:hover {
            background-color: #fff;
            box-shadow: 0 0 25px #ff69b4;
            transform: scale(1.02);
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #ffb6c1;
            text-align: center;
        }
        .logs {
            height: 150px;
            overflow-y: scroll;
            border: 1px solid #ff69b4;
            padding: 10px;
            margin-top: 20px;
            font-size: 0.8em;
            text-align: left;
            background: #000;
        }
        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 1.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: pulse 1.5s infinite;
            color: #ff69b4;
        }
        @keyframes glitch {
            0% { text-shadow: 0 0 10px #ff00ff; transform: translateX(0); }
            20% { text-shadow: -2px 0 #ff00ff, 2px 0 #ff69b4; transform: translateX(-2px); }
            40% { text-shadow: 0 0 10px #ff00ff; transform: translateX(0); }
            100% { text-shadow: 0 0 20px #ff00ff; transform: translateX(2px); }
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 5px #ff00ff; opacity: 0.8; }
            50% { text-shadow: 0 0 25px #ff69b4; opacity: 1; }
            100% { text-shadow: 0 0 5px #ff00ff; opacity: 0.8; }
        }
    </style>
</head>
<body>

    <h1>KammiHaxed // Slutty Node</h1>

    <div class="container">
        <div id="card-area" class="card-display">
            Waiting for tokenization...
        </div>

        <button id="btn-tap" onclick="startNFC()">INITIATE TAP TO PAY (NFC)</button>
        <button id="btn-payid" onclick="initiatePayID()">EXECUTE NPP PAYID TRANSFER</button>
        <button id="btn-token" onclick="generateToken()">GENERATE SLUTTY TOKEN</button>
        
        <div class="status" id="status-text">System Idle. Ready for signal.</div>

        <div class="logs" id="log-box">
            > System initialized.<br>
            > Connected to Render backend.<br>
            > Awaiting input...
        </div>
    </div>

    <div class="footer">FUCK THE POLICE</div>

    <!-- Hidden Audio Element for the Sound Effect -->
    <audio id="orgasm-sound" src="https://www.soundjay.com/human/sounds/woman-orgasm-1.mp3" preload="auto"></audio>

    <script src="/app.js"></script>
</body>
</html>
